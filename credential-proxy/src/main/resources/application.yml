server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8085}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
agentteams:
  credential-proxy:
    secret-root: ${AGENTTEAMS_CREDENTIAL_PROXY_SECRET_ROOT:/run/secrets}
    upstream-responses-url: ${AGENTTEAMS_CREDENTIAL_PROXY_UPSTREAM_RESPONSES_URL:https://api.openai.com/v1/responses}
    allowed-models: ${AGENTTEAMS_CREDENTIAL_PROXY_ALLOWED_MODELS:gpt-5.6-luna}
    max-active-streams: ${AGENTTEAMS_CREDENTIAL_PROXY_MAX_ACTIVE_STREAMS:64}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
