name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  worker-enrollment:
    name: Worker enrollment (Java 21)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress -pl worker-enrollment verify

      - name: Require PostgreSQL integration tests to execute
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse(
              "worker-enrollment/target/surefire-reports/TEST-io.agentteams.enrollment.JdbcWorkerSessionRepositoryPostgresTest.xml"
          ).getroot()
          assert report.attrib["tests"] == "4", report.attrib
          assert report.attrib["skipped"] == "0", report.attrib
          assert report.attrib["failures"] == "0", report.attrib
          assert report.attrib["errors"] == "0", report.attrib
          print("All 4 PostgreSQL integration tests executed successfully.")
          PY

      - name: Validate Compose and shell scripts
        run: |
          docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet
          bash -n deploy/compose/*.sh
