name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  worker-enrollment:
    name: Worker enrollment (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress -pl worker-enrollment verify

      - name: Validate Compose and shell scripts
        run: |
          docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet
          bash -n deploy/compose/*.sh
