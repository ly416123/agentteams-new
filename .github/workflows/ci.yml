name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: worker-enrollment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker-enrollment:
    name: Enrollment and credential proxy (Java 21)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Require PostgreSQL integration tests to execute
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse(
              "worker-enrollment/target/surefire-reports/TEST-io.agentteams.enrollment.JdbcWorkerSessionRepositoryPostgresTest.xml"
          ).getroot()
          oidc_report = ET.parse(
              "worker-enrollment/target/surefire-reports/TEST-io.agentteams.enrollment.OidcJwtIntegrationTest.xml"
          ).getroot()
          gateway_report = ET.parse(
              "worker-enrollment/target/surefire-reports/TEST-io.agentteams.enrollment.GatewaySessionHandshakeTest.xml"
          ).getroot()
          for name, suite, expected_count in (
              ("repository", report, "7"),
              ("signed OIDC to PostgreSQL", oidc_report, "6"),
              ("pinned Gateway gRPC session handshake", gateway_report, "5"),
          ):
              assert suite.attrib["tests"] == expected_count, (name, suite.attrib)
              assert suite.attrib["skipped"] == "0", (name, suite.attrib)
              assert suite.attrib["failures"] == "0", (name, suite.attrib)
              assert suite.attrib["errors"] == "0", (name, suite.attrib)
          print("All 18 PostgreSQL, OIDC, and pinned Gateway integration tests executed successfully.")
          PY

      - name: Require Attempt context authorization tests to execute
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse(
              "credential-proxy/target/surefire-reports/TEST-io.agentteams.credentialproxy.AttemptExecutionContextResolverTest.xml"
          ).getroot()
          assert report.attrib["tests"] == "9", report.attrib
          assert report.attrib["skipped"] == "0", report.attrib
          assert report.attrib["failures"] == "0", report.attrib
          assert report.attrib["errors"] == "0", report.attrib
          print("All 9 Attempt context authorization tests executed successfully.")
          PY

      - name: Require credential proxy database boundary tests to execute
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse(
              "credential-proxy/target/surefire-reports/TEST-io.agentteams.credentialproxy.JdbcActiveAttemptRepositoryPostgresTest.xml"
          ).getroot()
          assert report.attrib["tests"] == "4", report.attrib
          assert report.attrib["skipped"] == "0", report.attrib
          assert report.attrib["failures"] == "0", report.attrib
          assert report.attrib["errors"] == "0", report.attrib
          print("All 4 PostgreSQL credential proxy boundary tests executed successfully.")
          PY

      - name: Validate Compose and shell scripts
        run: |
          docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet
          bash -n deploy/compose/*.sh
          python3 -m unittest \
            verification.test_compose_fixed_worker_capacity \
            verification.test_compose_oidc_url_contract -v
